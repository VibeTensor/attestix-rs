# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: assertive
  auto_review:
    enabled: true
    drafts: true
    base_branches:
      - main
  request_changes_workflow: false
  path_filters:
    - "!**/target/**"
    - "!**/build/**"
    - "!**/node_modules/**"
chat:
  auto_reply: false
knowledge_base:
  opt_out: true
