# Publish the `attestix` crate to crates.io on a version tag.
#
# SETUP (one-time, done by a human in the GitHub web UI - never paste a token
# into a PR, an issue, a commit, or a chat):
#   1. crates.io -> Account Settings -> API Tokens -> New Token
#      scopes: publish-new + publish-update.  Copy it once.
#   2. This repo -> Settings -> Secrets and variables -> Actions -> New repository
#      secret named CARGO_REGISTRY_TOKEN.  Paste the token there (GitHub stores
#      it encrypted; it is never visible again and never reaches a maintainer).
#
# RELEASE:
#   - Bump `version` in Cargo.toml, commit, then push a matching tag:
#       git tag v0.4.0 && git push origin v0.4.0
#   - This workflow runs the full test suite (conformance vectors), then a
#     dry-run, then publishes.  A failed test or a tag/Cargo.toml version
#     mismatch blocks the publish.

name: publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing immutable version tag to publish"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: crates-publish-${{ github.event.inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # actions/checkout v4.3.0
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select the existing release tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Select an existing vMAJOR.MINOR.PATCH release tag"
            exit 1
          fi
          git fetch --no-tags origin "refs/heads/main:refs/remotes/origin/main"
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          if ! git merge-base --is-ancestor "refs/tags/$RELEASE_TAG" refs/remotes/origin/main; then
            echo "::error::The release tag must be part of the reviewed main branch"
            exit 1
          fi
          git checkout --detach "refs/tags/$RELEASE_TAG"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      # dtolnay/rust-toolchain stable (pinned)
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable

      - name: Verify tag matches Cargo.toml version
        run: |
          TAG="${RELEASE_TAG#v}"
          CRATE="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["packages"][0]["version"])')"
          echo "tag=$TAG crate=$CRATE"
          if [ "$TAG" != "$CRATE" ]; then
            echo "::error::tag v$TAG does not match Cargo.toml version $CRATE"
            exit 1
          fi

      - name: Resolve the dependency lock once
        run: cargo generate-lockfile

      - name: Install pinned RustSec audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit the exact dependency lock before publish
        run: cargo audit --deny warnings

      - name: Test (conformance vectors must pass before publish)
        run: cargo test --locked --all-features

      - name: Publish dry-run
        run: cargo publish --locked --dry-run

      - name: Verify registry credential is configured
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::Configure the crates.io publish secret before starting a release"
            exit 1
          fi

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

      - name: Verify crates.io version and uploaded package checksum
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import time
          import urllib.error
          import urllib.request

          version = os.environ["RELEASE_TAG"][1:]
          package = pathlib.Path("target/package") / f"attestix-{version}.crate"
          expected = hashlib.sha256(package.read_bytes()).hexdigest()
          url = f"https://crates.io/api/v1/crates/attestix/{version}"
          for attempt in range(24):
              try:
                  request = urllib.request.Request(url, headers={"User-Agent": "Pavan Kumar Dubasi"})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      published = json.load(response)["version"]
                  if published["num"] != version or published["yanked"] or published["checksum"] != expected:
                      raise SystemExit("Registry version/checksum did not match the tested upload")
                  print(f"Verified attestix {version} on crates.io with checksum {expected}")
                  break
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
                  if attempt == 23:
                      raise SystemExit("Published version did not become visible on crates.io")
                  time.sleep(5)
          PY
